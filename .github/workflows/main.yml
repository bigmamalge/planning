name: Android Build (Clean)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. Installer GraalVM (Le moteur)
        uses: gluonhq/setup-graalvm@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          graalvm: '22.1.0.1-Final'
          jdk: 'java17'

      - name: 2. Faire le ménage et Compiler
        run: |
          # ON DÉTRUIT les configurations toxiques de GitHub pour que Gluon soit le seul maître
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          
          # ON DÉSACTIVE le bug mémoire de Linux
          export JAVA_TOOL_OPTIONS="-XX:-UseContainerSupport"
          
          # ON LANCE LA COMPILATION
          chmod +x mvnw
          ./mvnw -B clean gluonfx:build -Dgluonfx.target=android

      - name: 3. Créer l'APK (Dans le silence)
        run: |
          # ON DÉTRUIT la variable mémoire pour que la console soit muette et ne fasse pas planter le packaging
          unset JAVA_TOOL_OPTIONS
          
          # ON CRÉE L'APK !
          ./mvnw -B gluonfx:package -Dgluonfx.target=android
            
      - name: 4. Récupérer l'application
        uses: actions/upload-artifact@v4
        with:
          name: MonApplicationAndroid
          path: target/gluonfx/aarch64-android/gvm/*.apk
