name: Android Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Gluon's GraalVM
        uses: gluonhq/setup-graalvm@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          graalvm: '22.1.0.1-Final'
          jdk: 'java17'

      # On passe sur Android 33 (le standard en or pour Gluon)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2 ndk;25.2.9519653'

      - name: Build and Package
        run: |
          chmod +x mvnw
          # La commande ultime : on passe l'astuce mémoire proprement au compilateur
          ./mvnw -B -e clean gluonfx:build gluonfx:package \
            -Dgluonfx.target=android \
            -Dgluonfx.nativeimage.args="-J-XX:-UseContainerSupport"
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-application-android
          # Le chemin exact où Gluon range l'APK final
          path: target/gluonfx/aarch64-android/gvm/*.apk
