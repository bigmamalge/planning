name: Android Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Gluon's GraalVM
        uses: gluonhq/setup-graalvm@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          graalvm: '22.1.0.1-Final'
          jdk: 'java17'

      # ON SUPPRIME le Setup Android de GitHub pour arrêter le conflit !
      
      - name: Préparer Maven
        run: chmod +x mvnw

      - name: 1. Build Native Image
        env:
          JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport"
        run: ./mvnw -B -e clean gluonfx:build -Dgluonfx.target=android

      - name: 2. Package APK
        run: |
          # 1. On nettoie la console pour ne pas faire paniquer l'emballeur
          unset JAVA_TOOL_OPTIONS
          
          # 2. LA SOLUTION ULTIME : On force les deux variables à être strictement identiques
          export ANDROID_HOME=$HOME/.gluon/substrate/Android
          export ANDROID_SDK_ROOT=$HOME/.gluon/substrate/Android
          
          # 3. On emballe l'APK !
          ./mvnw -B -e gluonfx:package -Dgluonfx.target=android
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-application-android
          path: target/gluonfx/aarch64-android/gvm/*.apk

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-erreur
          path: target/gluonfx/aarch64-android/gvm/log/
