name: Android Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Gluon's GraalVM
        uses: gluonhq/setup-graalvm@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          graalvm: '22.1.0.1-Final'
          jdk: 'java17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2 ndk;25.2.9519653'

      - name: Préparer Maven
        run: chmod +x mvnw

      # ÉTAPE 1 : La Compilation (avec le patch mémoire)
      - name: 1. Build Native Image
        env:
          JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport"
        run: ./mvnw -B -e clean gluonfx:build -Dgluonfx.target=android

      # ÉTAPE 2 : La Création de l'APK (sans le patch, pour éviter le bruit)
      - name: 2. Package APK
        run: ./mvnw -B -e gluonfx:package -Dgluonfx.target=android
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-application-android
          path: target/gluonfx/aarch64-android/gvm/*.apk
