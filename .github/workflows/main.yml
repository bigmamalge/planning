name: Android Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Gluon's GraalVM
        uses: gluonhq/setup-graalvm@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          graalvm: '22.1.0.1-Final'
          jdk: 'java17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Préparer Maven
        run: chmod +x mvnw

      - name: 1. Build Native Image
        env:
          JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport"
        run: ./mvnw -B -e clean gluonfx:build -Dgluonfx.target=android

      - name: 2. Package APK
        run: |
          # 1. On supprime la variable de GitHub pour éviter le conflit avec Gluon
          unset ANDROID_SDK_ROOT
          
          # 2. On génère la clé de signature manuellement pour éviter le plantage de Gradle
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # 3. On enlève la variable bavarde de la mémoire et on package
          unset JAVA_TOOL_OPTIONS
          ./mvnw -B -e gluonfx:package -Dgluonfx.target=android
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-application-android
          path: target/gluonfx/aarch64-android/gvm/*.apk

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-erreur
          path: target/gluonfx/aarch64-android/gvm/log/
