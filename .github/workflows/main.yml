name: Android Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM (JDK 17)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm-community' # On utilise le nom officiel
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw -B -e clean gluonfx:build gluonfx:package \
            -Dgluonfx.target=android \
            -Dgluonfx.nativeimage.args="-H:-UseCAPCache"
